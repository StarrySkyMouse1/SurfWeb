# 模式 A（构建发布）：宿主机 Nginx 示例
# 1. 将 Web/dist 内容部署到 root 所指目录
# 2. API 以 Kestrel 监听 127.0.0.1:5240（见 doc/deploy.md）
# 3. 复制到 /etc/nginx/sites-available/ 并按需改 server_name、root、SSL

server {
    listen 80;
    server_name surf.example.com;
    root /var/www/surfweb;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5240/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:5240/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5240/health;
    }
}
